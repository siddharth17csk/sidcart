<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SidCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="card">
        <a class="back-link" href="index.html">← Back to Home</a>
        <div class="logo">Sid<span>Cart</span></div>
        <h2>Welcome back! 👋</h2>
        <p class="sub">Sign in to continue shopping</p>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com">

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <a href="forgot.html" class="forgot">Forgot password?</a>

        <button id="login-btn">Sign In</button>
        <div id="status"></div>

        <div class="footer-text" style="margin-top:24px;">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
