<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SidCart - Who are you?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <div class="logo">Sid<span>Cart</span></div>
        <p class="tagline">Fast Delivery · Best Deals · Smart Shopping ⚡</p>
        <h2 class="question">Who are you today?</h2>
        <div class="cards">
            <a class="role-card" href="shop.html">
                <span class="icon">🛍️</span>
                <h2>Customer</h2>
                <p>Browse products, add to cart, and place orders with ease.</p>
                <span class="badge badge-green">Sign up / Log in</span>
            </a>
            <a class="role-card admin" href="admin-login.html">
                <span class="icon">🔐</span>
                <h2>Admin</h2>
                <p>Manage inventory, view reports, and control the store.</p>
                <span class="badge badge-dark">Secure Access</span>
            </a>
        </div>
    </div>
</body>
</html>
