<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SidCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="css/cart.css">
</head>
<body>
<header class="navbar">
    <div class="logo">Sid<span>Cart</span></div>
    <a class="back-link" href="shop.html">← Continue Shopping</a>
</header>

<div class="page">
    <div class="cart-section">
        <h1>Your Cart 🛒</h1>
        <div id="cart-items-container"></div>
    </div>
    <aside>
        <div class="summary-card" id="summary-card" style="display:none;">
            <h2>Order Summary</h2>
            <div class="summary-row"><span id="item-count-label">Items</span><span id="summary-items">₹0</span></div>
            <div class="summary-row"><span>Delivery</span><span style="color:var(--green);">FREE</span></div>
            <div class="summary-row total"><span>Total</span><span id="summary-total">₹0</span></div>

            <div class="payment-section">
                <label>Payment Method</label>
                <div class="payment-options">
                    <div class="payment-opt selected" data-method="cash">💵 Cash</div>
                    <div class="payment-opt" data-method="upi">📱 UPI</div>
                    <div class="payment-opt" data-method="credit">💳 Credit</div>
                </div>
            </div>

            <div class="credit-info" id="credit-info" style="display:none;">
                💳 Credit limit: ₹<span id="credit-limit-display">1000</span><br>
                Used: ₹<span id="credit-used">0</span> | Available: ₹<span id="credit-available">1000</span>
            </div>

            <button class="checkout-btn" id="checkout-btn">Place Order ✅</button>
            <div id="checkout-status"></div>
        </div>
    </aside>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script type="module" src="js/cart.js"></script>
</body>
</html>
