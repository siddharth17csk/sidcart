<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SidCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-login.css">
</head>
<body>
    <div class="card">
        <a class="back-link" href="index.html">← Back</a>
        <span class="shield">🛡️</span>
        <div class="logo">Admin <span>Access</span></div>
        <p class="subtitle">Restricted to authorized personnel only</p>

        <label>Email</label>
        <input type="email" id="email" placeholder="admin@sidcart.com">

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">

        <button id="login-btn">Enter Dashboard</button>
        <div id="status"></div>
    </div>

   <script type="module" src="js/admin-login.js"></script>
</body>
</html>
